# ===================================
# APPLICATION
# ===================================
spring.application.name=banking-system

# ===================================
# MYSQL DATABASE
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# HIKARICP CONNECTION POOL
# ===================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# DISABLE H2
# ===================================
spring.h2.console.enabled=false

# ===================================
# SERVER
# ===================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================
# SECURITY - JWT
# ===================================
security.jwt.secret-key=BankingSystemSecretKeyMinim256BitiPentruHS256AlgoritmSecuritate2024
security.jwt.expiration=86400000
security.jwt.refresh-expiration=604800000

# ===================================
# LOGGING
# ===================================
logging.level.root=INFO
logging.level.com.bank=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.profiles.active=console
spring.main.web-application-type=none
spring.banner.mode=off
logging.level.org.springframework=DEBUG
#logging.level.com.bank=DEBUG
# PERMITE SUPRASCR\u0130EREA BEAN-URILOR
spring.main.allow-bean-definition-overriding=true