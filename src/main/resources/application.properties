# ===================================
# APPLICATION
# ===================================
spring.application.name=banking-system

# ===================================
# SERVER
# ===================================
server.port=8082
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.session.persistent=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID

spring.session.store-type=none

# ===================================
# PROFIL ACTIV
# ===================================
spring.profiles.active=web
spring.main.web-application-type=servlet

# ===================================
# MYSQL DATABASE
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# HIKARICP CONNECTION POOL
# ===================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.validator.autofill=false

# ===================================
# SECURITY - JWT
# ===================================
security.jwt.secret-key=BankingSystemSecretKeyMinim256BitiPentruHS256AlgoritmSecuritate2024
security.jwt.expiration=86400000
security.jwt.refresh-expiration=604800000

# ===================================
# LOGGING
# ===================================
logging.level.root=INFO
logging.level.com.bank=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=DEBUG

# ===================================
# SUPRASCRIERE BEAN-URI
# ===================================
spring.main.allow-bean-definition-overriding=true

# ===================================
# CONFIGURA\u021AII PENTRU TESTE
# ===================================
banking.test.disable-minimum-validation=true

# ===================================
# ACTUATOR CONFIGURATION
# ===================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Afi\u0219eaz\u0103 detalii complete la health check
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Info despre aplica\u021Bie
management.info.env.enabled=true
info.application.name=Banking System
info.application.version=1.0.0
info.application.description=Sistem Bancar cu Monitorizare

# Metrici custom
management.metrics.tags.application=banking-system

# Format pentru serializare date
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================
# REDIS CACHE CONFIGURATION
# ===================================
spring.cache.type=none
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=bank:
spring.cache.redis.use-key-prefix=true

# Conexiune Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.repositories.enabled=false
