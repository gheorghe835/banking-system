# ===================================
# APPLICATION
# ===================================
spring.application.name=banking-system

# ===================================
# SERVER
# ===================================
server.port=8080
#server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================
# PROFIL ACTIV
# ===================================
spring.profiles.active=web
spring.main.web-application-type=servlet

# ===================================
# MYSQL DATABASE - DECOMENTEAZ\u0102
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# HIKARICP CONNECTION POOL - DECOMENTEAZ\u0102
# ===================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================
# JPA / HIBERNATE - DECOMENTEAZ\u0102
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# SECURITY - JWT - DECOMENTEAZ\u0102
# ===================================
security.jwt.secret-key=BankingSystemSecretKeyMinim256BitiPentruHS256AlgoritmSecuritate2024
security.jwt.expiration=86400000
security.jwt.refresh-expiration=604800000

# ===================================
# LOGGING - DECOMENTEAZ\u0102
# ===================================
logging.level.root=INFO
logging.level.com.bank=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=DEBUG

# ===================================
# SUPRASCRIERE BEAN-URI
# ===================================
spring.main.allow-bean-definition-overriding=true

# ===================================
# CONFIGURA\u021AII PENTRU TESTE
# ===================================
banking.test.disable-minimum-validation=true