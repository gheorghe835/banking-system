spring:
  application:
    name: banking-system

  datasource:
    url: jdbc:mysql://localhost:3306/banking_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234  # SCHIMBĂ LA PAROLA TA REALĂ
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: create  # SAU 'create-drop' pentru testare
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 20
        # FORȚEAZĂ crearea tabelelor
        # javax.persistence.schema-generation.database.action: create
    # IMPORTANT: Specifică pachetul entităților
    packages-to-scan: com.bank.infrastructure.persistence.entity

  # TEMPORAR: dezactivează scripturile SQL
  # sql:
  #   init:
  #     mode: never



  # SQL scripts pentru inițializare
  #sql:
   # init:
    #  mode: always  # pentru dev, în producție schimbă în 'never'
     # schema-locations: classpath:db/migration/V1__init_schema.sql
     # data-locations: classpath:db/data.sql

# Logging
logging:
  level:
    com.bank: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/banking-system.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Configurații bancare custom
banking:
  security:
    max-login-attempts: 3
    account-lock-time-minutes: 30
  limits:
    daily-withdrawal-default: 5000.00
    minimum-deposit: 1.00
    minimum-balance: 10.00
  exchange:
    commission-rate: 0.005  # 0.5%
    update-frequency: "0 0 9 * * ?"  # Daily at 9 AM

server:
  port: 8080