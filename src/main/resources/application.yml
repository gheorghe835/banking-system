# Banking Application Configuration

spring:
  application:
    name: banking-system

  # Database Configuration (pentru început folosim H2 în memorie)
  datasource:
    url: jdbc:h2:mem:bankdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # H2 Console (pentru vizualizare DB în browser)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # pentru început, update schema automat
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # Server Configuration
  server:
    port: 8080
    servlet:
      context-path: /banking

  # Profile setup
  profiles:
    active: dev

# Application specific settings
banking:
  app:
    name: "Banca Comercială "
    version: "1.0.0"

  security:
    max-login-attempts: 3
    account-lock-duration-minutes: 30

  currency:
    default: "MDL"
    supported:
      - "MDL"
      - "EUR"
      - "USD"
      - "GBP"
      - "RON"

# Logging Configuration
logging:
  level:
    com.bank: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: logs/banking-app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
