<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalii Cont</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2>Detalii Cont Bancar</h2>

    <div th:if="${success}" class="success">
        <p th:text="${success}"></p>
    </div>

    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>

    <div class="account-info">
        <p><strong>Număr Cont:</strong> <span th:text="${account.accountNumber}"></span></p>
        <p><strong>Proprietar:</strong> <span th:text="${account.owner.fullName}"></span></p>
        <p><strong>ID Client:</strong> <span th:text="${account.owner.customerId}"></span></p>
        <p><strong>Tip Cont:</strong> <span th:text="${account.accountType}"></span></p>
        <p><strong>Data creării:</strong> <span th:text="${#temporals.format(account.creationDate, 'dd.MM.yyyy')}"></span></p>
        <p><strong>Status:</strong>
            <span th:text="${account.active} ? 'Activ' : 'Inactiv'"
                  th:class="${account.active} ? 'active' : 'inactive'"></span>
        </p>
        <p><strong>Limită zilnică:</strong> <span th:text="${account.dailyWithdrawalLimit} + ' MDL'"></span></p>

        <!-- Câmp pentru parolă (doar pentru administratori) -->
        <p><strong>Parolă cont:</strong>
            <span th:text="${account.passwordHash}"></span>
            <small class="hint">(parola criptată)</small>
        </p>
    </div>

    <h3>Solduri</h3>
    <table>
        <thead>
        <tr>
            <th>Monedă</th>
            <th>Sold</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${account.allBalances}">
            <td th:text="${entry.key}"></td>
            <td th:text="${entry.value} + ' ' + ${entry.key}"></td>
        </tr>
        <tr class="total">
            <td><strong>Total (MDL):</strong></td>
            <td><strong th:text="${account.totalBalanceInMDL} + ' MDL'"></strong></td>
        </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/web/admin/accounts/block/{id}(id=${account.accountNumber}, user=${param.user})}"
           class="btn btn-warning" th:if="${account.active}">🔒 Blochează Cont</a>
        <a th:href="@{/web/admin/accounts/unblock/{id}(id=${account.accountNumber}, user=${param.user})}"
           class="btn btn-success" th:unless="${account.active}">🔓 Deblochează Cont</a>
        <a th:href="@{/web/admin/accounts(user=${param.user})}" class="btn-secondary">Înapoi</a>
    </div>
</div>
</body>
</html>
