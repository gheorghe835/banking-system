<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Creare Cont Bancar Nou</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js"></script>

</head>
<body>
<div class="container">
    <h2>Creare Cont Bancar Nou</h2>

    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/web/admin/accounts/create}" method="post">

        <!-- ========================================= -->
        <!-- SECȚIUNEA 1: ALEGERE TIP CLIENT -->
        <!-- ========================================= -->
        <div class="client-type-selector">
            <h3>Clientul:</h3>
            <label>
                <input type="radio" name="clientType" value="existing" checked onclick="toggleClientSection('existing')">
                Există deja în sistem
            </label>
            <label>
                <input type="radio" name="clientType" value="new" onclick="toggleClientSection('new')">
                Client nou
            </label>
        </div>

        <!-- ========================================= -->
        <!-- SECȚIUNEA 2: CLIENT EXISTENT -->
        <!-- ========================================= -->
        <div id="existing-client-section" class="existing-client-section">
            <h3>Selectează Client Existent</h3>
            <div class="form-group">
                <label for="customerId">ID Client:</label>
                <select id="customerId" name="customerId">
                    <option value="">Selectează client</option>
                    <option th:each="customer : ${customers}"
                            th:value="${customer.customerId}"
                            th:text="${customer.fullName} + ' (' + ${customer.customerId} + ') - ' + ${customer.email}">
                    </option>
                </select>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- SECȚIUNEA 3: CLIENT NOU (ASCUNSĂ INIȚIAL) -->
        <!-- ========================================= -->
        <div id="new-client-section" class="new-client-section hidden">
            <h3>Date Client Nou</h3>

            <div class="form-group">
                <label for="firstName">Prenume:</label>
                <input type="text" id="firstName" name="firstName">
            </div>

            <div class="form-group">
                <label for="lastName">Nume:</label>
                <input type="text" id="lastName" name="lastName">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phoneNumber">Telefon:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber"
                       pattern="[0-9+\s]{10,15}">
                <small class="hint">Ex: +37369123456 sau 069123456</small>
            </div>

            <div class="form-group">
                <label for="birthDate">Data Nașterii:</label>
                <input type="date" id="birthDate" name="birthDate">
            </div>

            <div class="form-group">
                <label for="identityNumber">IDNP (13 cifre):</label>
                <input type="text" id="identityNumber" name="identityNumber"
                       pattern="[0-9]{13}" maxlength="13">
            </div>

            <div class="form-group">
                <label for="address">Adresă:</label>
                <textarea id="address" name="address" rows="2"></textarea>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- SECȚIUNEA 4: DATELE CONTULUI (COMUNE) -->
        <!-- ========================================= -->
        <h3>Datele Contului</h3>

        <div class="form-group">
            <label for="accountNumber">Număr Cont (16 cifre):</label>
            <input type="text" id="accountNumber" name="accountNumber"
                   pattern="[0-9]{16}" maxlength="16" required>
            <small class="hint">16 cifre, fără spații</small>
        </div>

        <div class="form-group">
            <label for="accountType">Tip Cont:</label>
            <select id="accountType" name="accountType" required>
                <option value="CURRENT">Curent</option>
                <option value="SAVINGS">Economii</option>
                <option value="BUSINESS">Business</option>
            </select>
        </div>

        <div class="form-group">
            <label for="initialBalance">Sold Inițial (MDL):</label>
            <input type="number" id="initialBalance" name="initialBalance"
                   step="0.01" min="0" value="0">
        </div>

        <button type="submit" class="btn">Crează Cont</button>
        <a href="/web/admin/management" class="btn-secondary">Anulează</a>
    </form>
</div>
<div class="form-group">
    <label for="password">Parolă cont:</label>
    <input type="password" id="password" name="password"
           minlength="6" required>
    <small class="hint">Minim 6 caractere, va fi criptată în baza de date</small>
</div>

<div class="form-group">
    <label for="confirmPassword">Confirmă parola:</label>
    <input type="password" id="confirmPassword" name="confirmPassword"
           minlength="6" required>
</div>


<script>
    function toggleClientSection(type) {
        const existingSection = document.getElementById('existing-client-section');
        const newSection = document.getElementById('new-client-section');

        if (type === 'existing') {
            existingSection.classList.remove('hidden');
            newSection.classList.add('hidden');

            // Dezactivează câmpurile clientului nou
            document.querySelectorAll('#new-client-section input, #new-client-section select').forEach(field => {
                field.disabled = true;
            });
            document.querySelectorAll('#existing-client-section select').forEach(field => {
                field.disabled = false;
            });

        } else {
            existingSection.classList.add('hidden');
            newSection.classList.remove('hidden');

            // Activează câmpurile clientului nou
            document.querySelectorAll('#new-client-section input, #new-client-section select').forEach(field => {
                field.disabled = false;
            });
            document.querySelectorAll('#existing-client-section select').forEach(field => {
                field.disabled = true;
            });
        }
    }

    // Inițializare la încărcarea paginii
    document.addEventListener('DOMContentLoaded', function() {
        toggleClientSection('existing');
    });
</script>
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            e.preventDefault();
            alert('Parolele nu coincid!');
        }

        if (password.length < 6) {
            e.preventDefault();
            alert('Parola trebuie să aibă minim 6 caractere!');
        }
    });
</script>
</body>
</html>
