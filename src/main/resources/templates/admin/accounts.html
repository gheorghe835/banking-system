<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Conturi</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2>Lista Conturi Bancare</h2>

    <div class="actions-bar">
        <a th:href="@{/web/admin/accounts/create(user=${param.user})}" class="btn btn-success">
            ➕ Adaugă Cont Nou
        </a>
        <a th:href="@{/web/admin/management(user=${param.user})}" class="btn-secondary">Înapoi</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Număr Cont</th>
            <th>Proprietar</th>
            <th>Tip</th>
            <th>Sold (MDL)</th>
            <th>Status</th>
            <th>Acțiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.accountNumber}"></td>
            <td th:text="${account.ownerName}"></td>
            <td th:text="${account.accountType}"></td>
            <td th:text="${account.balances?.get('MDL')}"></td>
            <td>
                <span th:text="${account.active} ? 'Activ' : 'Inactiv'"
                      th:class="${account.active} ? 'active' : 'inactive'"></span>
            </td>
            <td>

                <a th:href="@{/web/admin/accounts/{id}(id=${account.accountNumber}, user=${param.user})}"
                   class="btn-small">Detalii</a>
                <a th:href="@{/web/admin/accounts/block/{id}(id=${account.accountNumber}, user=${param.user})}"
                   class="btn-small btn-warning"
                   th:if="${account.active}">Blochează</a>
                <a th:href="@{/web/admin/accounts/unblock/{id}(id=${account.accountNumber}, user=${param.user})}"
                   class="btn-small btn-success"
                   th:unless="${account.active}">Deblochează</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/web/admin/management(user=${param.user})}" class="btn-secondary">Înapoi</a>
</div>
</body>
</html>
