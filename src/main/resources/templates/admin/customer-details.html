<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalii Client</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2>Detalii Client</h2>

    <div th:if="${success}" class="success">
        <p th:text="${success}"></p>
    </div>

    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>

    <div class="customer-info">
        <p><strong>ID Client:</strong> <span th:text="${customer.customerId}"></span></p>
        <p><strong>Nume:</strong> <span th:text="${customer.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
        <p><strong>Telefon:</strong> <span th:text="${customer.phoneNumber}"></span></p>
        <p><strong>Data nașterii:</strong> <span th:text="${#temporals.format(customer.birthDate, 'dd.MM.yyyy')}"></span></p>
        <p><strong>IDNP:</strong> <span th:text="${customer.identityNumber}"></span></p>
        <p><strong>Adresă:</strong> <span th:text="${customer.address} ?: '-'"></span></p>
        <p><strong>Data înregistrării:</strong> <span th:text="${#temporals.format(customer.registrationDate, 'dd.MM.yyyy HH:mm')}"></span></p>
        <p><strong>Status:</strong>
            <span th:text="${customer.active} ? 'Activ' : 'Inactiv'"
                  th:class="${customer.active} ? 'active' : 'inactive'"></span>
        </p>
    </div>

    <h3>Conturi asociate</h3>
    <div th:if="${accounts.empty}" class="info">
        <p>Clientul nu are conturi bancare.</p>
    </div>

    <div th:each="account : ${accounts}" class="account-section">
        <h4>Cont: <span th:text="${account.accountNumber}"></span>
            (<span th:text="${account.accountType}"></span>)
            <span th:text="${account.active} ? '🟢 Activ' : '🔴 Inactiv'"
                  th:class="${account.active} ? 'active' : 'inactive'"></span>
        </h4>

        <table class="balances-table">
            <thead>
            <tr>
                <th>Monedă</th>
                <th>Sold</th>
                <th>Echivalent MDL</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${account.allBalances}">
                <td th:text="${entry.key}"></td>
                <td th:text="${#numbers.formatDecimal(entry.value, 0, 2)} + ' ' + ${entry.key}"></td>
                <!-- Calcul corect pentru echivalentul în MDL -->
                <td th:text="${#numbers.formatDecimal(entry.value, 0, 2)} + ' ' + ${entry.key}"></td>
            <tr class="total-row">
                <td colspan="2"><strong>Total în MDL:</strong></td>
                <td><strong th:text="${#numbers.formatDecimal(account.totalBalanceInMDL, 0, 2)} + ' MDL'"></strong></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="actions">
        <a th:href="@{/web/admin/customers/edit/{id}(id=${customer.customerId}, user=${param.user})}" class="btn">✏️ Editează Client</a>
        <a th:href="@{/web/admin/customers/toggle/{id}(id=${customer.customerId}, user=${param.user})}"
           class="btn" th:classappend="${customer.active} ? 'btn-warning' : 'btn-success'"
           th:text="${customer.active} ? '🔒 Dezactivează' : '🔓 Activează'"></a>
        <a th:href="@{/web/admin/customers(user=${param.user})}" class="btn-secondary">Înapoi la listă</a>
    </div>
</div>

</body>
</html>
