<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adăugare Client Nou</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js"></script>
    <script>
        function confirmSave() {

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const birthDate = document.getElementById('birthDate').value;
            const identityNumber = document.getElementById('identityNumber').value;

            if (!firstName || !lastName || !email || !phoneNumber || !birthDate || !identityNumber) {
                alert('❌ Toate câmpurile obligatorii trebuie completate!');
                return false;
            }

            // Confirmare salvare
            return confirm('✅ Sunteți sigur că doriți să salvați acest client?');
        }
    </script>
</head>
<body>
<div class="container">
    <h2>Adăugare Client Nou</h2>

    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/web/admin/customers/create}" method="post" onsubmit="return confirmSave()">
        <input type="hidden" name="user" th:value="${param.user}" />

        <div class="form-group">
            <label for="firstName">Prenume:</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
            <label for="lastName">Nume:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Telefon:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required>
        </div>

        <div class="form-group">
            <label for="birthDate">Data Nașterii:</label>
            <input type="date" id="birthDate" name="birthDate" required>
            <small class="hint">Format: yyyy-MM-dd</small>
        </div>

        <div class="form-group">
            <label for="identityNumber">IDNP (13 cifre):</label>
            <input type="text" id="identityNumber" name="identityNumber"
                   pattern="[0-9]{13}" maxlength="13" required>
            <small class="hint">13 cifre, fără spații</small>
        </div>

        <div class="form-group">
            <label for="address">Adresă:</label>
            <textarea id="address" name="address" rows="3"></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">✅ Salvează Client</button>
            <a th:href="@{/web/admin/customers(user=${param.user})}" class="btn btn-secondary">❌ Anulează</a>
        </div>
    </form>
</div>
</body>
</html>
