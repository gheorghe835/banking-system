<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Schimbă Parola</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2>🔐 Schimbă Parola</h2>

    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>

    <div th:if="${success}" class="success">
        <p th:text="${success}"></p>
    </div>

    <div class="account-info">
        <p><strong>Cont:</strong> <span th:text="${accountNumber}"></span></p>
        <p><strong>Client:</strong> <span th:text="${ownerName}"></span></p>
    </div>

    <form th:action="@{/web/client/change-password}" method="post">
        <input type="hidden" name="account" th:value="${param.account}" />
        <div class="form-group">
            <label for="currentPassword">Parola actuală:</label>
            <input type="password" id="currentPassword" name="currentPassword" required>
        </div>

        <div class="form-group">
            <label for="newPassword">Parola nouă:</label>
            <input type="password" id="newPassword" name="newPassword"
                   minlength="6" required>
            <small class="hint">Minim 6 caractere</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmă parola nouă:</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   minlength="6" required>
        </div>

        <button type="submit" class="btn">Schimbă Parola</button>
        <a th:href="@{/web/client/dashboard(account=${param.account})}"
           class="btn btn-secondary">⬅️ Revenire la Panou</a>
    </form>

    <div class="password-rules">
        <h4>Reguli pentru parolă:</h4>
        <ul>
            <li>Minim 6 caractere</li>
            <li>Poate conține litere și cifre</li>
            <li>Nu folosiți parole ușor de ghicit</li>
        </ul>
    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const newPass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (newPass !== confirm) {
            e.preventDefault();
            alert('Parolele noi nu coincid!');
        }

        if (newPass.length < 6) {
            e.preventDefault();
            alert('Parola nouă trebuie să aibă minim 6 caractere!');
        }
    });
</script>

</body>
</html>
