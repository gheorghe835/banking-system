<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Depunere</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2>Depunere Numerar</h2>

    <form th:action="@{/web/client/deposit}" method="post">
        <input type="hidden" name="account" th:value="${param.account}" />
        <div class="form-group">
            <label for="amount">Suma:</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
            <label for="currency">Moneda:</label>
            <select id="currency" name="currencyCode">
                <option value="MDL">MDL - Leu Moldovenesc</option>
                <option value="EUR">EUR - Euro</option>
                <option value="USD">USD - Dolar American</option>
            </select>
        </div>

        <button type="submit" class="btn">Depune</button>
        <a th:href="@{/web/client/dashboard(account=${param.account})}" class="btn-secondary">Anulează</a>
        <h2>Panou Administrator</h2>

    </form>
</div>
</body>
</html>
