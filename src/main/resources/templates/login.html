<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autentificare</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Stiluri suplimentare pentru pagina de autentificare */
        .auth-header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: #2c3e50;
            font-size: 2em;
            border-bottom: 2px solid #007bff;
            display: inline-block;
            padding-bottom: 10px;
        }

        .auth-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
            font-size: 1.1em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 15px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-back {
            display: block;
            text-align: center;
            padding: 12px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }

        .error {
            max-width: 450px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            color: #721c24;
            text-align: center;
            font-weight: bold;
        }

        /* Stiluri specifice pentru manager */
        .auth-header.manager h2 {
            border-bottom-color: #28a745;
        }

        .btn-submit.manager {
            background: linear-gradient(135deg, #28a745, #218838);
        }

        .btn-submit.manager:hover {
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }

        /* Adaugă un icon pentru fiecare tip de autentificare */
        .auth-icon {
            text-align: center;
            font-size: 3em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Antet cu icon și titlu -->
    <div class="auth-header" th:classappend="${manager} ? 'manager' : ''">
        <div class="auth-icon" th:text="${manager} ? '👔' : '👤'"></div>
        <h2 th:text="${manager} ? 'Autentificare Manager' : 'Autentificare Client'">
            Autentificare
        </h2>
    </div>

    <!-- Container pentru formular -->
    <div class="auth-container" th:classappend="${manager} ? 'manager' : ''">
        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/web/login}" method="post">
            <input type="hidden" name="manager" th:value="${manager}">

            <div class="form-group">
                <label for="username" th:text="${manager} ? '👔  Utilizator:' : '💳  Număr cont:'">
                    Utilizator:
                </label>
                <input type="text" id="username" name="username"
                       th:placeholder="${manager} ? 'Introduceți numele de utilizator' : 'Introduceți numărul contului'"
                       required>
            </div>

            <div class="form-group">
                <label for="password">🔒  Parolă:</label>
                <input type="password" id="password" name="password"
                       placeholder="Introduceți parola" required>
            </div>

            <button type="submit" class="btn-submit" th:classappend="${manager} ? 'manager' : ''">
                <span th:text="${manager} ? '🔑  Autentificare Manager' : '🔐  Autentificare Client'"></span>
            </button>
        </form>

        <a href="/web/" class="btn-back">←  Înapoi la pagina principală</a>
    </div>
</div>
</body>
</html>
