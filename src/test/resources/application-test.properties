# MySQL Database for TESTS - SEPARAT\u0102 de cea de produc\u021Bie!
spring.datasource.url=jdbc:mysql://localhost:3306/banking_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate - ATEN\u021AIE! create-drop \u0219terge tot la fiecare test
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Important: Nu folosi H2!
spring.test.database.replace=none

spring.jpa.properties.hibernate.validator.autofill=false